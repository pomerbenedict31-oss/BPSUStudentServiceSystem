<!DOCTYPE html>

<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  ```
  <title>BPSU Student Login</title>
  ```

</head>

<body>

<h1>BPSU</h1>

<h2>Bataan Peninsula State University</h2>

<h3>Student Service Management System</h3>

<hr>

<h2>Student Login</h2>

<form action="/login" method="post">

  ```
  <label for="email">
    BPSU Email:
  </label>

  <br>

  <input
          type="email"
          id="email"
          name="email"
          placeholder="example@bpsu.edu.ph"
          required
  >

  <br><br>

  <label for="studentId">
    Student ID:
  </label>

  <br>

  <input
          type="text"
          id="studentId"
          name="studentId"
          placeholder="00-00000"
          required
  >

  <br><br>

  <label for="password">
    Password:
  </label>

  <br>

  <input
          type="password"
          id="password"
          name="password"
          placeholder="00-00000"
          required
  >

  <br><br>

  <button type="submit">
    Login
  </button>
  ```

</form>

<br>

<p
        th:if="${error}"
        th:text="${error}">
</p>

</body>

</html>
