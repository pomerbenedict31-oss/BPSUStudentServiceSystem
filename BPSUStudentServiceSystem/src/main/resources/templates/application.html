<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0">

    <title>BPSU Student Application</title>
</head>

<body>

<h1>BPSU Student Service Management System</h1>

<h2>Student Service Application</h2>

<hr>

<p>
    Student ID:
    <strong th:text="${studentId}"></strong>
</p>

<p>
    BPSU Email:
    <strong th:text="${email}"></strong>
</p>

<p>
    Selected Office:
    <strong th:text="${office}"></strong>
</p>

<hr>

<form
        action="/application/submit"
        method="post">

    <input
            type="hidden"
            name="office"
            th:value="${office}"
    >

    <label for="applicationType">
        Application Type:
    </label>

    <br>

    <select
            id="applicationType"
            name="applicationType"
            required>

        <option value="">
            -- Select Application Type --
        </option>

        <option
                th:each="type : ${applicationTypes}"
                th:value="${type}"
                th:text="${type}">
        </option>

    </select>

    <br><br>

    <label for="purpose">
        Purpose:
    </label>

    <br>

    <textarea
            id="purpose"
            name="purpose"
            rows="6"
            cols="50"
            placeholder="Enter the purpose of your application..."
            required></textarea>

    <br><br>

    <button type="submit">
        Submit Application
    </button>

</form>

<br>

<a href="/student/history">
    My Application History
</a>

<br><br>

<a href="/student/logout">
    Logout
</a>

</body>

</html>
